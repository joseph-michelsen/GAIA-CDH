[platformio]
default_envs = feather_s3

[env]
test_framework = unity
build_src_flags = -Wall -Wextra -Werror

[env:reverse_tft]
platform = espressif32
board = adafruit_feather_esp32s3_reversetft
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_src_filter = +<*> -<main.cpp>
build_flags = -DHAS_DEBUG_DISPLAY
lib_deps = 
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library

[env:feather_s3]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_src_filter = +<*> -<bench/> 

[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<drivers/max17048.cpp> +<drivers/bme680.cpp> +<drivers/scd30.cpp> +<drivers/pcf8523.cpp> +<services/> +<app/>
build_flags = -Isrc
test_ignore = test_board_*

[env:board_test]
extends = env:feather_s3
build_flags = -Isrc
test_build_src = yes
build_src_filter = -<*> +<drivers/>
test_filter = test_board_*

[env:bench]
extends = env:feather_s3
build_src_filter = +<*> -<main.cpp>