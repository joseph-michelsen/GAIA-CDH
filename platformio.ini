[platformio]
default_envs = reverse_tft

[env]
test_framework = unity
build_src_flags = -Wall -Wextra -Werror

[env:reverse_tft]
platform = espressif32
board = adafruit_feather_esp32s3_reversetft
framework = arduino
monitor_speed = 115200
build_flags = -DHAS_DEBUG_DISPLAY
lib_deps = 
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library

[env:feather_s3]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino
monitor_speed = 115200

[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<drivers/max17048.cpp> +<drivers/bme680.cpp> +<drivers/scd30.cpp> +<drivers/pcf8523.cpp> +<services/>
build_flags = -Isrc
test_ignore = test_board_*

[env:board_test]
extends = env:reverse_tft
build_flags = -Isrc
test_build_src = yes
build_src_filter = -<*> +<drivers/>
test_filter = test_board_*